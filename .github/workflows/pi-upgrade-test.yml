name: Pi upgrade test
on:
  push:
    branches: [pelikhan-pi-dependency-upgrade]
    paths: [.github/workflows/pi-upgrade-test.yml]
permissions:
  contents: read
jobs:
  upgrade-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - name: Resolve Pi 1.2.0 dependencies
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm ls @earendil-works/pi-agent-core @earendil-works/pi-ai
      - name: Save resolved lockfile
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pi-upgrade-lockfile
          path: package-lock.json
          retention-days: 1
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
