- id: sdk-jsonrpc-server
  config:
    maxTokensAsSuccess: false

- id: sandbox-policy
  config:
    mode: read-only
    workspaceRoot: !!js process.cwd()

- id: approval
  config:
    policy: never

- id: permission
  config:
    presets:
      awf-read-only:
        sandbox: read-only
        approval: never
    defaultPreset: awf-read-only
